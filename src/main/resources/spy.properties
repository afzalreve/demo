# Logger configuration

#This class handles how the SQL query logs are captured and formatted.
module.log=com.example.demo.logging.CustomP6SpyLogger

logging=true

logMessageFormat=com.p6spy.engine.spy.appender.MultiLineFormat

#This class defines how and where the logs are sent (e.g., writing them to a custom log file, database, or centralized logging service).
#appender=com.p6spy.engine.spy.appender.FileAppender
appender=com.example.demo.logging.CustomP6SpyLogger

# Register the custom JdbcEventListener
jdbc.event.listener=com.example.demo.logging.CustomJdbcEventListener

moduleList=com.example.demo.logging.CustomP6SpyFactory

# Filtering SQL operations
filter=true
include=update
#include=insert,update,delete
exclude=com.p6spy.*


#module.log=com.p6spy.engine.spy.P6SpyFactory
#modulelist=com.p6spy.engine.spy.P6SpyFactory
#customAppender=com.p6spy.engine.spy.appender.Slf4JLogger
jdbcEventListener=com.example.demo.logging.CustomJdbcEventListener
